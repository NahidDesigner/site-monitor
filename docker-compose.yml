# Coolify deploys this as a "Docker Compose" resource.
#
# The container idles; the check itself runs as a Coolify Scheduled Task, which
# execs into this service on a cron. Nothing is declared here that Coolify
# supplies at runtime -- environment variables come from the Coolify UI, not an
# env_file, because .env is gitignored and a missing env_file aborts the deploy.
services:
  monitor:
    build: .
    environment:
      DATABASE_PATH: /data/site-monitor.db
      SITES_FILE: /app/sites.yaml
    volumes:
      - monitor-data:/data
    # Keeps the container alive so scheduled tasks have somewhere to exec.
    # The check is the scheduled command, not this process.
    entrypoint: []
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  monitor-data:
