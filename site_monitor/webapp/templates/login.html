<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Site Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--paper:#F4F5F7;--surface:#FFF;--ink:#16202B;--ink-faint:#7C8894;
 --rule:#DDE1E6;--rule-strong:#C4CBD3;--copper:#A85434;--bad:#A3342F;--bad-wash:#F8E7E5}
@media (prefers-color-scheme:dark){:root{--paper:#0F1720;--surface:#16202B;--ink:#E6EAEE;
 --ink-faint:#74818E;--rule:#263341;--rule-strong:#354557;--copper:#D98661;
 --bad:#E0796F;--bad-wash:#2B1817}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;padding:24px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:9px;
 padding:34px 32px;width:100%;max-width:378px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;
 letter-spacing:-.02em;margin-bottom:6px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--copper)}
p.sub{margin:0 0 24px;color:var(--ink-faint);font-size:13.5px}
label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px}
input{width:100%;font-family:'JetBrains Mono',monospace;font-size:14px;padding:11px 13px;
 border:1px solid var(--rule-strong);border-radius:6px;background:var(--paper);color:var(--ink)}
button{width:100%;margin-top:18px;padding:11px;border:none;border-radius:6px;
 background:var(--copper);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.err{background:var(--bad-wash);border:1px solid var(--bad);color:var(--bad);
 padding:10px 13px;border-radius:6px;font-size:13px;margin-bottom:18px}
</style></head>
<body>
<form class="box" method="post" action="/login">
  <div class="brand"><span class="dot"></span>Site Monitor</div>
  <p class="sub">Elementor CSS and PageSpeed monitoring.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autofocus autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body></html>
